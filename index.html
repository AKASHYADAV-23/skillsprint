<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>SkillSprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky navy header, navy page heads, light content bands. Hash-routed pages. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#12163A; --muted:#566086; --line:#DADFEE; --soft:#E8ECF7;
  --navy:#12163A; --navy2:#1C2150; --hero-ink:#F2F3FB; --hero-muted:#B4BAD9;
  --amber:#F2A900; --amber-ink:#12163A; --accent:#0B766C; --mint:#5EDBCB; --danger:#B3362A; --ok:#12805C;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1024; --surface:#161A38; --ink:#EDEFFA; --muted:#A3AACB; --line:#2A3060; --soft:#20264F;
  --navy:#0A0D1F; --navy2:#161A38; --accent:#5EDBCB; --danger:#F08A7E; --ok:#6FD9B0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1024; --surface:#161A38; --ink:#EDEFFA; --muted:#A3AACB; --line:#2A3060; --soft:#20264F;
  --navy:#0A0D1F; --navy2:#161A38; --accent:#5EDBCB; --danger:#F08A7E; --ok:#6FD9B0; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:72px}
.eyebrow{margin:0 0 12px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.dark .eyebrow,.hero .eyebrow,.phead .eyebrow{color:var(--mint)}
.h2{font-size:clamp(28px,4vw,42px);max-width:780px}
.lead{font-size:18px;color:var(--muted);max-width:660px;margin-top:14px}
.dark{background:var(--navy);color:var(--hero-ink)}
.dark .lead,.hero .lead,.phead .lead{color:var(--hero-muted)}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--hero-ink);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr .in{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font:700 20px var(--display)}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{padding:8px 11px;border-radius:999px;font-size:14px;font-weight:500;color:var(--hero-muted)}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav .me{border:1px solid rgba(255,255,255,.25);color:#fff}
.menu{display:none;margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
@media(max-width:1020px){.menu{display:block}.nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--navy);padding:10px max(16px,env(safe-area-inset-left,0px)) 16px;margin:0;border-bottom:1px solid rgba(255,255,255,.1)}.nav.open{display:flex}.nav a{padding:12px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;background:var(--amber);color:var(--amber-ink);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.line{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.teal{background:var(--accent);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default;transform:none;filter:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
/* heads */
.hero{background:var(--navy);color:var(--hero-ink);padding-block:56px 80px}
.hero .in{display:flex;flex-wrap:wrap;gap:48px;align-items:center}
.hero .in>div{flex:1 1 440px;min-width:0}
.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.03;margin-bottom:22px}
.hero .lead{font-size:20px;margin-bottom:28px}
.phead{background:var(--navy);color:var(--hero-ink);padding-block:44px 48px}
.phead h1{font-size:clamp(32px,5vw,52px);max-width:820px}
.phead .lead{margin-top:14px}
/* cards, pills, forms */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
.card h3{font-size:22px;margin-bottom:8px}
.card p{color:var(--muted)}
a.card{display:flex;flex-direction:column;gap:10px;transition:transform .25s,box-shadow .25s}
a.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px -22px rgba(18,22,58,.5)}
.pill{display:inline-block;font:500 12px var(--mono);letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 50%,var(--line));color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--hero-ink);border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form .full{grid-column:1/-1}
.fmsg{font-size:14px;font-weight:600;min-height:20px}
.fmsg.err{color:var(--danger)}.fmsg.ok{color:var(--ok)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--hero-ink)}
.muted{color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:36px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 20px var(--display);color:var(--ink);margin-bottom:6px}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:14px;padding:14px 16px;min-width:0}
.stat b{font:700 28px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
/* home */
.today{background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:16px}
.today h3{font-size:24px}
.today .stat{background:rgba(255,255,255,.08)}.today .stat span{color:var(--hero-muted)}
.steps{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:36px}
.step{background:var(--navy2);border-radius:18px;padding:26px;border-top:5px solid var(--mint)}
.step b{font:500 13px var(--mono);color:var(--mint);display:block;margin-bottom:10px}
.step h3{font-size:22px;margin-bottom:8px}.step p{color:var(--hero-muted)}
.split{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
details+details{margin-top:10px}
summary{font-weight:600;cursor:pointer}
details p{margin-top:10px;color:var(--muted)}
/* planner */
.two{display:grid;gap:24px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:20px;min-width:0}
.tl{position:relative;margin-top:14px}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--muted);padding-top:2px}
.blk{position:absolute;left:58px;right:0;border:0;border-radius:10px;padding:3px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-size:13px;line-height:1.25}
.blk b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk small{font-size:11px;opacity:.8}
.blk.fixed{background:var(--soft);color:var(--muted)}
.blk.study{background:#CDF2ED;color:#0B4A44}.blk.skill{background:#FBE2A3;color:#5A3D00}.blk.other{background:#DDE3FA;color:#232B63}
.blk.done{opacity:.55}.blk.done b{text-decoration:line-through}
.nowline{position:absolute;left:50px;right:0;border-top:2px solid var(--danger);z-index:2}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .grow b{text-decoration:line-through;opacity:.6}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--danger)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;padding:0}
/* study */
.ring{display:block}.ring .trk{stroke:var(--soft)}.ring .prg{stroke:var(--accent)}
.fring{position:relative;width:200px;height:200px;margin:0 auto}
.fring .time{position:absolute;inset:0;display:grid;place-items:center;font:700 44px var(--display);font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--amber);color:var(--amber-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg small{display:block;margin-top:6px;font:500 11px var(--mono);color:var(--accent)}
.topic p{margin-top:10px}.topic pre{margin:10px 0 0;white-space:pre-wrap;font:500 13px/1.5 var(--mono);background:var(--bg);padding:12px;border-radius:10px;overflow-x:auto}
/* tracks */
.tcard{--c:var(--accent)}
.tcard .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lessons{display:grid;gap:6px}
.les{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px}
.les[aria-current="true"]{border-color:var(--accent)}
.les .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:13px;font-weight:700}
.les.done .n{background:var(--accent);color:var(--bg)}
.pts{margin:14px 0;padding-left:20px;display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin-top:8px}
.opt.bad{border-color:var(--danger);opacity:.7}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
/* gigs */
.gig{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.gig .pay{font:700 26px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.gig .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.contact{font:500 14px var(--mono);background:var(--soft);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere}
.live{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--ok)}
/* pricing */
.plans{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plan.hot{background:var(--navy);color:var(--hero-ink);border:3px solid var(--amber)}
.plan .price{font:700 44px var(--display)}.plan .price small{font:500 16px var(--body);opacity:.75}
.plan ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}.plan.hot ul{color:var(--hero-muted)}
.cta{background:var(--amber);color:var(--amber-ink)}
.cta .btn{background:var(--navy);color:var(--hero-ink)}
/* footer, toast */
.foot{background:var(--navy);color:var(--hero-muted);padding-block:44px;font-size:14px}
.foot .in{display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 20px}.foot a:hover{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--navy);color:var(--hero-ink);border:1px solid rgba(255,255,255,.2);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;transition:transform .4s;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0)}
@media(max-width:700px){.band{padding-block:52px}.hero{padding-block:36px 56px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

var START=8,SLOTS=24,SH=30,DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],viewDate=today();
function hm(s){var m=START*60+s*30,h=Math.floor(m/60),mm=m%60;return h+':'+(mm?'30':'00')}
function hlabel(h){return h<12?h+' AM':h===12?'12 PM':(h-12)+' PM'}
function layout(date){
  var wd=(new Date(date+'T00:00:00').getDay()+6)%7,occ=[],i,fixed=[];
  for(i=0;i<SLOTS;i++)occ[i]=false;
  S.classes.filter(function(c){return c.day===wd}).forEach(function(c){var d=Math.min(c.d,SLOTS-c.s);fixed.push({t:c.title,s:c.s,d:d});for(var k=0;k<d;k++)occ[c.s+k]=true});
  var rank={study:0,other:1,skill:2},list=S.tasks.filter(function(t){return t.date===date}).sort(function(a,b){return rank[a.type]-rank[b.type]||a.id-b.id});
  function from(t){if(S.pref==='morning')return t.type==='skill'?12:0;return t.type==='skill'?4:16}
  function find(st,need){for(var s=st;s+need<=SLOTS;s++){var ok=true;for(var k=0;k<need;k++)if(occ[s+k]){ok=false;break}if(ok)return s}return null}
  var out=[],lost=[];
  list.forEach(function(t){var need=t.dur+(t.dur>=3?1:0),s=find(from(t),need);if(s===null)s=find(0,need);if(s===null){need=t.dur;s=find(0,need)}
    if(s!==null)for(var k=0;k<need;k++)occ[s+k]=true;else lost.push(t.title);
    out.push({id:t.id,title:t.title,dur:t.dur,type:t.type,done:t.done,s:s})});
  return{fixed:fixed,tasks:out,lost:lost};
}
function timelineHTML(date){
  var P=layout(date),h='',i;
  for(i=0;i<SLOTS;i+=2)h+='<div class="hl" style="top:'+(i*SH)+'px"><span>'+hlabel(START+i/2)+'</span></div>';
  P.fixed.forEach(function(f){h+='<div class="blk fixed" style="top:'+(f.s*SH+1)+'px;height:'+(f.d*SH-3)+'px"><b>'+esc(f.t)+'</b><small>'+hm(f.s)+' to '+hm(f.s+f.d)+'</small></div>'});
  P.tasks.forEach(function(t){if(t.s===null)return;h+='<button type="button" class="blk task '+t.type+(t.done?' done':'')+'" data-act="toggle" data-id="'+t.id+'" aria-pressed="'+t.done+'" style="top:'+(t.s*SH+1)+'px;height:'+(t.dur*SH-3)+'px"><b>'+(t.done?'✓ ':'')+esc(t.title)+'</b><small>'+hm(t.s)+' to '+hm(t.s+t.dur)+'</small></button>'});
  if(date===today()){var n=new Date(),mins=n.getHours()*60+n.getMinutes()-START*60;if(mins>=0&&mins<SLOTS*30)h+='<div class="nowline" style="top:'+(mins/30*SH)+'px" title="Now"></div>'}
  return{html:'<div class="tl" style="height:'+(SLOTS*SH)+'px">'+h+'</div>',lost:P.lost};
}

/* ---------- focus timer ---------- */
var F={dur:25,left:1500,end:0,run:false,tm:0};
function two(n){return (n<10?'0':'')+n}
function fPaint(){var t=$('#ftime');if(!t)return;var s=Math.ceil(F.left);t.textContent=two(Math.floor(s/60))+':'+two(s%60);
  var r=$('#focusRing');if(r){var c=2*Math.PI*92;r.style.strokeDasharray=c;r.style.strokeDashoffset=c*(F.left/(F.dur*60))}
  var b=$('#fgo');if(b)b.textContent=F.run?'Pause':(F.left<F.dur*60?'Resume':'Start');var m=$('#fmin');if(m)m.textContent=S.focusMin}
function fTick(){F.left=Math.max(0,(F.end-Date.now())/1000);if(F.left<=0)fDone();else fPaint()}
function fStart(){if(F.run){F.left=Math.max(0,(F.end-Date.now())/1000);F.run=false;clearInterval(F.tm);fPaint();return}F.end=Date.now()+F.left*1000;F.run=true;clearInterval(F.tm);F.tm=setInterval(fTick,250);fPaint()}
function fDone(){clearInterval(F.tm);F.run=false;S.focusMin+=F.dur;touch();save();toast('Focus session done: '+F.dur+' minutes logged');F.left=F.dur*60;fPaint()}
function fReset(){clearInterval(F.tm);F.run=false;F.left=F.dur*60;fPaint()}
function fSet(m){if(F.run)return;F.dur=m;F.left=m*60;fPaint()}

var DB=null,UID=null,ADMIN=false,LIVE={state:'connecting'},REMOTE=[],APPL={},MYREMOTE=[];
function normGig(d,id){return{id:id,title:d.title||'',cat:d.cat||'General',budget:+d.budget||0,days:+d.days||0,desc:d.desc||'',biz:d.biz||'',contact:d.contact||'',by:d.by||'',created:+d.created||0,local:false}}
function allGigs(){return REMOTE.concat(S.localGigs.map(function(g){return Object.assign({},g,{local:true})})).sort(function(a,b){return b.created-a.created})}
function applicants(g){var n=APPL[g.id]||0;if(S.applied.indexOf(g.id)>=0&&MYREMOTE.indexOf(g.id)<0)n++;return n}
function eligible(g){return g.cat==='General'||hasBadge(g.cat)}
function initCaps(){
  var timer=setTimeout(function(){if(LIVE.state==='connecting'){LIVE.state='offline';refreshLive()}},10000);
  if(!window.claude||!window.claude.use){LIVE.state='offline';clearTimeout(timer);refreshLive();return}
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var u=r[0],d=r[1];
    return (u&&u.id?u.id():Promise.resolve(null)).then(function(id){
      UID=id;try{ADMIN=!!(u&&u.canEdit&&u.canEdit())}catch(e){}
      if(!d||!UID){LIVE.state='offline';clearTimeout(timer);refreshLive();return}
      DB=d;
      DB.collection('gigs').orderBy('created','desc').limit(200).onSnapshot(function(snap){
        REMOTE=snap.docs.map(function(x){return normGig(x.data()||{},x.id)});
        if(!snap.metadata.fromCache||true){LIVE.state='live';clearTimeout(timer)}refreshLive()},
        function(){LIVE.state='offline';refreshLive()});
      DB.collection('applied').onSnapshot(function(snap){
        APPL={};MYREMOTE=[];
        snap.docs.forEach(function(x){var ids=(x.data()||{}).gigIds;if(!Array.isArray(ids))return;ids.forEach(function(i){APPL[i]=(APPL[i]||0)+1});if(x.id===UID)MYREMOTE=ids.slice()});
        refreshLive()},function(){})
    })}).catch(function(){LIVE.state='offline';clearTimeout(timer);refreshLive()})
}
function postGig(g){
  g.created=Date.now();g.by=UID||'';
  if(DB){return DB.collection('gigs').add(g).then(function(){return{shared:true}}).catch(function(){return localGig(g)})}
  return Promise.resolve(localGig(g))}
function localGig(g){var c=Object.assign({},g,{id:'L'+Date.now().toString(36)});S.localGigs.push(c);save();return{shared:false}}
function saveLead(kind,data){
  data.at=Date.now();S.leads[kind]=data;save();
  if(!DB||!UID)return Promise.resolve(false);
  var ref=DB.doc('leads/'+UID);
  return ref.get().then(function(s){var cur=s.exists?Object.assign({},s.data()):{};cur[kind]=data;return ref.set(cur)}).then(function(){return true}).catch(function(){return false})}

  +'<div class="card"><h3>'+(complete(t)?'Badge earned':'The '+t.cat+' badge')+'</h3><p style="margin-top:6px">'+(complete(t)?'You can apply to '+t.cat+' gigs.':'Finish all '+t.lessons.length+' lessons with every check correct to unlock '+t.cat+' gigs.')+'</p></div></div></div></section>'}
function answer(tid,k){var t=track(tid),i=LESI[tid]||0,l=t.lessons[i],key=tid+':'+i,qs=QS[key]||(QS[key]={picked:[],ok:false});
  if(k===l.a){qs.ok=true;var d=S.lessons[tid]||(S.lessons[tid]=[]);if(d.indexOf(i)<0){d.push(i);touch();save();toast(complete(t)?'Track complete. '+t.cat+' badge earned':'Lesson complete. +20 XP')}}
  else{qs.picked.push(k)}
  render()}
